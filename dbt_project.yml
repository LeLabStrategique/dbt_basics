# Name your project! 
name: 'my_new_project'
version: '1.0.0'
config-version: 2
profile: 'default'

# ... (model-paths, analysis-paths, etc. restent inchangés) ...

vars:
    # -----------------------------------------------------------------
    # Configuration des variables sources pour le package Fivetran/LinkedIn (Étape 2)
    # -----------------------------------------------------------------
    linkedin_pages_database: dbt-bq-training-473915 # VALEUR STATIQUE CORRECTE
    linkedin_pages_schema: linkedin_company_pages 

models:
  my_new_project:
    # 1. Configuration de votre PROPRE projet dbt (vos modèles marts)
    # Nous allons les placer dans un schéma 'analytics' ou 'marts' pour la clarté.
    +schema: analytics 
    
    # Configuration par défaut (peut être supprimée si non utilisée)
    example:
      +materialized: table
      
  linkedin_pages:
    # 2. Configuration du PACKAGE Fivetran.
    # On force le staging Fivetran dans un dataset séparé 'fivetran_staging'
    # pour isoler les transformations Fivetran de votre propre staging.
    staging:
      +schema: fivetran_staging
      +materialized: view # Optionnel, mais recommandé pour économiser le coût BigQuery